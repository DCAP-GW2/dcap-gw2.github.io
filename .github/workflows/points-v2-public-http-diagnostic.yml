name: DCAP v2 minimal public HTTP response diagnostic
on:
  push:
    branches:
      - test/points-v2-live-https-cors-check-20261120
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect public HTTP response type, not raw content
        env:
          PUBLIC_URL: https://script.google.com/macros/s/AKfycbyQv6tisEz0zF6Jv-s0iMGJsL5CxplWyi_tpUle4XD3CK1HLuSjxwJFjDrTedFXDuMH/exec
        run: |
          node --input-type=module <<'JS'
          const u=process.env.PUBLIC_URL;
          const resp=await fetch(u,{redirect:'follow'});
          const body=await resp.text();
          const title=body.match(/<title[^>]*>([^<]{0,100})<\\/title>/i)?.[1]||null;
          let kind=null;try{kind=JSON.parse(body).kind||null}catch{}
          console.log('PUBLIC_HTTP_SAFE_DIAGNOSTIC',JSON.stringify({
            status:resp.status,finalHost:new URL(resp.url).hostname,
            contentType:resp.headers.get('content-type')?.split(';')[0],
            redirected:resp.redirected,length:body.length,
            isHtml:body.trim().startsWith('<'),
            title,kind,
            signInHint:/sign in|sign-in|accounts.google|login/i.test(body),
            accessHint:/you need access|unable to open|authorization required|script function not found/i.test(body)
          }));
          JS
