name: DCAP v2 continuous feed — isolated QA only

on:
  push:
    branches:
      - feat/points-v2-continuous-feed-offline-20261119

permissions:
  contents: read

concurrency:
  group: dcap-v2-live-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm no live deployment or active live feed switch
        run: |
          node --input-type=module -e "import{readFileSync}from'node:fs';import assert from'node:assert/strict';const s=JSON.parse(readFileSync('points/data/v2/selection.json'));assert.equal(s.revision,'r000');const c=readFileSync('points/v2/live-config.mjs','utf8');assert(c.includes('LIVE_FEED_ENABLED = false'));assert(c.includes(\"LIVE_FEED_URL = ''\"));"
      - name: Run all Node tests including live feed and backend
        run: npm test
      - name: Run additional ESM tests
        run: node --test tests/*.test.mjs
