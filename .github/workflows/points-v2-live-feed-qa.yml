name: DCAP v2 continuous feed — isolated QA only

on:
  push:
    branches:
      - feat/points-v2-continuous-feed-offline-20261119

permissions:
  contents: read

concurrency:
  group: dcap-v2-live-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm no live deployment or active live feed switch
        run: |
          node --input-type=module -e "import{readFileSync}from'node:fs';import assert from'node:assert/strict';const s=JSON.parse(readFileSync('points/data/v2/selection.json'));assert.equal(s.revision,'r000');const c=readFileSync('points/v2/live-config.mjs','utf8');assert(c.includes('LIVE_FEED_ENABLED = false'));assert(c.includes(\"LIVE_FEED_URL = ''\"));"
      - name: Run all Node tests including live feed and backend
        run: npm test
      - name: Run additional ESM tests
        run: node --test tests/*.test.mjs
      - name: Install local Chromium browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Start isolated localhost static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dcap-live-feed-test.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/points/data/v2/selection.json > /dev/null
      - name: Mock API Chromium website and fallback acceptance
        run: node tests/points-v2-live-browser.mjs
      - name: Retain test report only, no Pages deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcap-v2-continuous-feed-${{ github.run_number }}
          path: test-results/points-v2-live-browser.json
          if-no-files-found: ignore
          retention-days: 7
